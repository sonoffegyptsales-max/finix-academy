<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-label="Choosing a SONOFF device class by installation constraint"><rect width="700" height="360" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">SONOFF portfolio: choosing by job, not by name</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">اختيار المنتج حسب المهمة</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="40" y="62" width="125" height="58" rx="6" fill="#f8fafc" stroke="#15803d" stroke-width="1.6"/><text x="102.5" y="89.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">In-line relay</text><text x="102.5" y="105.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">behind an existing switch</text><rect x="205" y="62" width="125" height="58" rx="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.6"/><text x="267.5" y="89.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Wall switch</text><text x="267.5" y="105.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">replaces the faceplate</text><rect x="370" y="62" width="125" height="58" rx="6" fill="#f8fafc" stroke="#c2410c" stroke-width="1.6"/><text x="432.5" y="89.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Socket / plug</text><text x="432.5" y="105.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">no wiring at all</text><rect x="535" y="62" width="125" height="58" rx="6" fill="#f8fafc" stroke="#5b6472" stroke-width="1.6"/><text x="597.5" y="89.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Gateway / hub</text><text x="597.5" y="105.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">carries the mesh</text><text x="40" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Is the wiring accessible?</text><text x="300" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">Neutral present?</text><text x="40" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Is the faceplate replaceable?</text><text x="300" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">Client accepts new look?</text><text x="40" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Is it a plug-in appliance?</text><text x="300" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">Portable load?</text><rect x="28" y="132" width="644" height="128" rx="8" fill="none" stroke="#c9d2de" stroke-width="1.3" stroke-dasharray="4 4"/><text x="40" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#c2410c" font-weight="600" text-anchor="start">Decide in this order — wiring first, appearance second, convenience last.</text><text x="684" y="310" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">القرار بالترتيب: التوصيل أولًا ثم الشكل ثم الراحة</text><text x="16" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">A socket cannot solve a lighting job; a relay cannot solve a rented flat.</text><text x="684" y="350" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">المقبس لا يحل مشكلة إنارة، والمرحل لا يصلح لشقة مؤجرة</text></svg>