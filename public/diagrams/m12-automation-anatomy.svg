<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="Four parts of a reliable automation rule"><rect width="700" height="300" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Anatomy of a reliable automation</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">تشريح الأتمتة الموثوقة</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="30" y="66" width="130" height="56" rx="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.6"/><text x="95.0" y="92.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">TRIGGER</text><text x="95.0" y="108.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">what starts it</text><rect x="200" y="66" width="130" height="56" rx="6" fill="#f8fafc" stroke="#c2410c" stroke-width="1.6"/><text x="265.0" y="92.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">CONDITION</text><text x="265.0" y="108.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">when it may run</text><rect x="370" y="66" width="130" height="56" rx="6" fill="#f8fafc" stroke="#15803d" stroke-width="1.6"/><text x="435.0" y="92.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">ACTION</text><text x="435.0" y="108.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">what it does</text><rect x="540" y="66" width="130" height="56" rx="6" fill="#f8fafc" stroke="#5b6472" stroke-width="1.6"/><text x="605.0" y="92.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">FALLBACK</text><text x="605.0" y="108.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">if it fails</text><line x1="160" y1="94" x2="200" y2="94" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M200 94 L193 90 L193 98 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><line x1="330" y1="94" x2="370" y2="94" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M370 94 L363 90 L363 98 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><line x1="500" y1="94" x2="540" y2="94" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M540 94 L533 90 L533 98 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="95" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="middle">Motion detected</text><text x="265" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="middle">after sunset AND</text><text x="435" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="middle">hall light 40%</text><text x="605" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="middle">off after 3 min</text><text x="265" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="middle">nobody home = skip</text><text x="605" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="middle">manual switch wins</text><rect x="22" y="132" width="656" height="60" rx="6" fill="none" stroke="#c9d2de" stroke-width="1.2" stroke-dasharray="4 4"/><text x="30" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#c2410c" font-weight="600" text-anchor="start">An automation without a condition fires at noon. Without a fallback it traps the client.</text><text x="684" y="250" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">بدون شرط تعمل في غير وقتها، وبدون بديل تحبس العميل</text><text x="16" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">The manual switch must always override the automation.</text><text x="684" y="290" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">المفتاح اليدوي يجب أن يتجاوز الأتمتة دائمًا</text></svg>