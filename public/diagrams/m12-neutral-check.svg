<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img" aria-label="Deciding smart switch type by presence of a neutral conductor"><rect width="680" height="348" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">The neutral question, before you quote</text><text x="664" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">سؤال السلك المحايد قبل التسعير</text><line x1="16" y1="34" x2="664" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="40" y="66" width="170" height="92" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/><text x="125.0" y="110.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Switch box has</text><text x="125.0" y="126.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">LIVE + NEUTRAL</text><rect x="250" y="66" width="170" height="92" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/><text x="335.0" y="110.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Switch box has</text><text x="335.0" y="126.0" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">LIVE only</text><text x="125" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#15803d" font-weight="600" text-anchor="middle">Standard smart switch</text><text x="125" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="middle">fits directly</text><text x="335" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#b91c1c" font-weight="600" text-anchor="middle">No-neutral model, OR</text><text x="335" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="middle">in-line relay at the fitting</text><line x1="125" y1="158" x2="125" y2="176" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M125 176 L121 169 L129 169 Z" fill="#15803d" stroke="#15803d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><line x1="335" y1="158" x2="335" y2="176" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M335 176 L331 169 L339 169 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><rect x="450" y="66" width="200" height="138" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="550" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#c2410c" font-weight="700" text-anchor="middle">Test, never assume</text><text x="468" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">Probe live-to-neutral</text><text x="468" y="136" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">Probe live-to-earth</text><text x="468" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">A reading on both means</text><text x="468" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">a true neutral is present</text><text x="40" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">A blue wire is not proof. Older installations loop switched-live in blue.</text><text x="664" y="268" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">اللون الأزرق ليس دليلًا — قِس قبل الحكم</text><text x="16" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">Getting this wrong on site turns a one-hour job into a rewire.</text><text x="664" y="338" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">الخطأ هنا يحوّل عملًا من ساعة إلى إعادة تمديد</text></svg>