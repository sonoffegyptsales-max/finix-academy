<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" role="img" aria-label="Wireless protocol comparison"><rect width="680" height="348" fill="#ffffff"/><text x="16" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="14.5" font-weight="700" fill="#12151b" text-anchor="start">Wireless protocol trade-offs</text><text x="664" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="end" xml:lang="ar">مقايضات البروتوكولات اللاسلكية</text><line x1="16" y1="34" x2="664" y2="34" stroke="#d7dee8" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><rect x="154" y="58" width="118" height="28" rx="5" fill="#fff7f3" stroke="#c2410c" stroke-width="1.4"/><text x="213.0" y="77" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Wi-Fi</text><rect x="280" y="58" width="118" height="28" rx="5" fill="#fff7f3" stroke="#c2410c" stroke-width="1.4"/><text x="339.0" y="77" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Zigbee</text><rect x="406" y="58" width="118" height="28" rx="5" fill="#fff7f3" stroke="#c2410c" stroke-width="1.4"/><text x="465.0" y="77" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Thread</text><rect x="532" y="58" width="118" height="28" rx="5" fill="#fff7f3" stroke="#c2410c" stroke-width="1.4"/><text x="591.0" y="77" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Z-Wave</text><text x="16" y="114" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#12151b" text