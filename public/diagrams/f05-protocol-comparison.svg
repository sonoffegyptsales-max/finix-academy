,sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">yes</text><text x="591.0" y="156" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">yes</text><text x="16" y="198" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#12151b" text-anchor="start">Band</text><text x="144" y="212" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">النطاق</text><line x1="16" y1="210" x2="664" y2="210" stroke="#e8edf3" stroke-width="1.1" opacity="1.0" stroke-linecap="round"/><text x="213.0" y="198" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#5b6472" text-anchor="middle">2.4/5 GHz</text><text x="339.0" y="198" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#5b6472" text-anchor="middle">2.4 GHz</text><text x="465.0" y="198" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#5b6472" text-anchor="middle">2.4 GHz</text><text x="591.0" y="198" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#5b6472" text-anchor="middle">sub-GHz</text><text x="16" y="240" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#12151b" text-anchor="start">Needs hub</text><text x="144" y="254" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">بوابة</text><line x1="16" y1="252" x2="664" y2="252" stroke="#e8edf3" stroke-width="1.1" opacity="1.0" stroke-linecap="round"/><text x="213.0" y="2