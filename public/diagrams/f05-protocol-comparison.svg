e UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">No protocol wins outright. Match the radio to the device's power source and duty.</text><text x="664" y="338" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">اختر البروتوكول حسب مصدر الطاقة والوظيفة</text></svg>