<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" width="640" height="308" role="img" aria-label="Duty standby pump alternation"><rect width="640" height="308" fill="#ffffff"/><text x="16" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="14.5" font-weight="700" fill="#12151b" text-anchor="start">Duty / standby alternation</text><text x="624" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="end" xml:lang="ar">تبادل المضخات</text><line x1="16" y1="34" x2="624" y2="34" stroke="#d7dee8" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><text x="16" y="100" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="600" fill="#12151b" text-anchor="start">Demand</text><text x="122" y="114" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">الطلب</text><line x1="128" y1="96" x2="594" y2="96" stroke="#e2e8f0" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><text x="16" y="170" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="600" fill="#12151b" text-anchor="start">Pump A</text><text x="122" y="184" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">مضخة أ</text><line x1="128" y1="166" x2="594" y2="166" stroke="#e2e8f0" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><text x="16" y="232" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="600" fill="#12151b" text-anchor="start">Pump B</text><text x="122" y="246" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">مضخة ب</text><line x1="128" y1="228" x2="594" y2="228" stroke="#e2e8f0" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><line x1="250" y1="84" x2="250" y2="252" stroke="#c9d2de" stroke-width="1.0" opacity="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="386" y1="84" x2="386" y2="252" stroke="#c9d2de" stroke-width="1.0" opacity="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M128 96 L128 79 L586 79" fill="none" stroke="#12151b" stroke-width="2.2" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M128 166 L128 149 L250 149 L250 166 L386 166 L386 149 L586 149" fill="none" stroke="#c2410c" stroke-width="2.2" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M128 228 L250 228 L250 211 L386 211 L386 228 L586 228" fill="none" stroke="#c2410c" stroke-width="2.2" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="270" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="middle">cycle 1</text><text x="386" y="270" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="middle">cycle 2</text><text x="16" y="282" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">Alternating on each cycle wears both pumps evenly and proves the standby still runs.</text><text x="624" y="298" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">التبادل يوزع البلى ويثبت صلاحية الاحتياطي</text></svg>