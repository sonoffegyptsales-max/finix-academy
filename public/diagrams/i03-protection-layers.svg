<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" role="img" aria-label="Overload versus short circuit protection"><rect width="640" height="318" fill="#ffffff"/><text x="16" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="14.5" font-weight="700" fill="#12151b" text-anchor="start">Overload versus short circuit</text><text x="624" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="end" xml:lang="ar">الحمل الزائد مقابل القصر</text><line x1="16" y1="34" x2="624" y2="34" stroke="#d7dee8" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><rect x="24" y="74" width="150" height="50" rx="6" fill="#f1f4f8" stroke="#b91c1c" stroke-width="1.6"/><text x="99" y="96" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Short circuit</text><text x="160" y="114" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">قصر</text><line x1="184" y1="99" x2="209" y2="99" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M214 99 L207 95 L207 103 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="222" y="94" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#12151b" text-anchor="start">huge current, instant</text><text x="222" y="112" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">breaker clears it in milliseconds</text><rect x="24" y="142" width="150" height="50" rx="6" fill="#f1f4f8" stroke="#c2410c" stroke-width="1.6"/><text x="99" y="164" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="middle">Overload</text><text x="160" y="182" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">حمل زائد</text><line x1="184" y1="167" x2="209" y2="167" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M214 167 L207 163 L207 171 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="222" y="162" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#12151b" text-anchor="start">moderate current, sustained</text><text x="222" y="180" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">overload relay, thermal image</text><rect x="24" y="210" width="150" height="50" rx="6" fill="#f1f4f8" stroke="#15803d" stroke-width="1.6"/><text x="99" y="232" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">Thermistor</text><text x="160" y="250" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">ثرمستور</text><line x1="184" y1="235" x2="209" y2="235" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M214 235 L207 231 L207 239 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="222" y="230" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#12151b" text-anchor="start">winding temperature</text><text x="222" y="248" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">senses heat the current cannot show</text><text x="16" y="292" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">Each answers a different threat. Neither device substitutes for the other.</text><text x="624" y="308" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">لا يغني أحدهما عن الآخر</text></svg>