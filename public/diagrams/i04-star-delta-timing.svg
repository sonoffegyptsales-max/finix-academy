ill="#5b6472" text-anchor="end" xml:lang="ar">الدلتا</text><line x1="118" y1="220" x2="594" y2="220" stroke="#e2e8f0" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><line x1="118" y1="84" x2="118" y2="262" stroke="#c9d2de" stroke-width="1.0" opacity="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="190" y1="84" x2="190" y2="262" stroke="#c9d2de" stroke-width="1.0" opacity="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="330" y1="84" x2="330" y2="262" stroke="#c9d2de" stroke-width="1.0" opacity="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="360" y1="84" x2="360" y2="262" stroke="#c9d2de" stroke-width="1.0" opacity="1.0" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M118 96 L118 78 L586 78" fill="none" stroke="#c2410c" stroke-width="2.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M118 158 L118 140 L330 140 L330 158" fill="none" stroke="#c2410c" stroke-width="2.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="330" y1="158" x2="586" y2="158" stroke="#c2410c" stroke-width="2.3" opacity="1.0" stroke-linecap="round"/><line x1="118" y1="220" x2="360" y2="220" stroke="#c2410c" stroke-width="2.3" opacity="1.0" stroke-linecap="round"/><path d="M360 220 L360 202 L586 202" fill="none" stroke="#c2410c" stroke-width="2.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><rect x="330" y="84" width="30" height="178" rx="3" fill="#fdecec" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 3"/><text x="345.0" y="280" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">dead time</text><text x="124" y="296" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">start</text><text x="278" y="296" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="middle">changeover</text><text x="16" y="312" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">KM2 must open before KM3 closes. Overlap is a phase-to-phase short across the windings.</text><text x="624" y="328" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">تراكب النجمة والدلتا يعني قصرًا بين الأوجه</text></svg>