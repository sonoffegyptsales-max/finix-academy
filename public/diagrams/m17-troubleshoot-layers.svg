<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-label="Four-layer troubleshooting order from load to logic"><rect width="700" height="372" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Symptom to root cause: work outward</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">من العَرَض إلى السبب: اعمل من الداخل للخارج</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="30" y="56" width="330" height="44" rx="6" fill="#f8fafc" stroke="#15803d" stroke-width="1.5"/><text x="44" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">1. The load</text><text x="44" y="91" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">Does it work on a plain switch?</text><line x1="368" y1="78" x2="410" y2="78" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M410 78 L403 74 L403 82 Z" fill="#15803d" stroke="#15803d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="420" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">prove it, then move on</text><rect x="30" y="112" width="330" height="44" rx="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5"/><text x="44" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">2. The device</text><text x="44" y="147" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">LED on? responds locally?</text><line x1="368" y1="134" x2="410" y2="134" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M410 134 L403 130 L403 138 Z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="420" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">prove it, then move on</text><rect x="30" y="168" width="330" height="44" rx="6" fill="#f8fafc" stroke="#c2410c" stroke-width="1.5"/><text x="44" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">3. The link</text><text x="44" y="203" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">paired? in range? router nearby?</text><line x1="368" y1="190" x2="410" y2="190" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M410 190 L403 186 L403 194 Z" fill="#c2410c" stroke="#c2410c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="420" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">prove it, then move on</text><rect x="30" y="224" width="330" height="44" rx="6" fill="#f8fafc" stroke="#b91c1c" stroke-width="1.5"/><text x="44" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">4. The logic</text><text x="44" y="259" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">scene, condition, schedule</text><line x1="368" y1="246" x2="410" y2="246" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M410 246 L403 242 L403 250 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="420" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">prove it, then move on</text><line x1="195" y1="100" x2="195" y2="124" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M195 124 L191 117 L199 117 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><line x1="195" y1="156" x2="195" y2="180" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M195 180 L191 173 L199 173 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><line x1="195" y1="212" x2="195" y2="236" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M195 236 L191 229 L199 229 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="30" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#c2410c" font-weight="600" text-anchor="start">Most call-outs end at layer 1 or 2. Starting at the app wastes the visit.</text><text x="684" y="324" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">معظم الأعطال تنتهي عند الطبقة الأولى أو الثانية</text><text x="16" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">Prove each layer before blaming the next one.</text><text x="684" y="362" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">أثبت كل طبقة قبل اتهام التالية</text></svg>