<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-label="eWeLink cloud versus local control paths"><rect width="700" height="330" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">eWeLink: cloud path vs local path</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">المسار السحابي مقابل المسار المحلي</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="30" y="70" width="120" height="52" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/><text x="90.0" y="100.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Phone app</text><rect x="290" y="62" width="130" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="355.0" y="86.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">eWeLink cloud</text><rect x="290" y="140" width="130" height="40" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/><text x="355.0" y="164.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">LAN / gateway</text><rect x="550" y="100" width="120" height="52" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/><text x="610.0" y="130.0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">Device</text><line x1="152" y1="88" x2="288" y2="88" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M288 88 L281 84 L281 92 Z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><line x1="422" y1="100" x2="548" y2="100" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M548 100 L541 96 L541 104 Z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="215" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1d4ed8" font-weight="600" text-anchor="middle">internet</text><line x1="152" y1="160" x2="288" y2="160" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M288 160 L281 156 L281 164 Z" fill="#15803d" stroke="#15803d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><line x1="422" y1="146" x2="548" y2="146" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M548 146 L541 142 L541 150 Z" fill="#15803d" stroke="#15803d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="215" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="middle">local only</text><text x="30" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#c2410c" font-weight="600" text-anchor="start">Cloud path dies with the internet. Local path survives it.</text><text x="684" y="240" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">المسار السحابي (Cloud) يتوقف بانقطاع الإنترنت، والمحلي يستمر</text><text x="30" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">Always demo the local path to the client before handover.</text><text x="16" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">Scenes stored on the gateway keep running; cloud-only scenes stop.</text><text x="684" y="320" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">المشاهد على البوابة تستمر، والسحابية تتوقف</text></svg>