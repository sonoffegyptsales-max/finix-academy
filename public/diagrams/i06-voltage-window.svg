<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" role="img" aria-label="Voltage monitoring healthy window"><rect width="640" height="318" fill="#ffffff"/><text x="16" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="14.5" font-weight="700" fill="#12151b" text-anchor="start">Voltage monitoring window</text><text x="624" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="end" xml:lang="ar">نافذة مراقبة الجهد</text><line x1="16" y1="34" x2="624" y2="34" stroke="#d7dee8" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><line x1="78" y1="240" x2="78" y2="75" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M78 70 L74 77 L82 77 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="78" y1="240" x2="581" y2="240" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M586 240 L579 236 L579 244 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="80" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12.5" font-weight="700" fill="#5b6472" text-anchor="end">V</text><text x="586" y="260" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="end">time</text><rect x="78" y="112" width="498" height="84" rx="0" fill="#eefaf1" stroke="#15803d" stroke-width="0"/><line x1="78" y1="112" x2="576" y2="112" stroke="#b91c1c" stroke-width="1.4" opacity="1.0" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="78" y1="196" x2="576" y2="196" stroke="#b91c1c" stroke-width="1.4" opacity="1.0" stroke-linecap="round" stroke-dasharray="5 4"/><text x="580" y="105" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="end">over-voltage trip</text><text x="580" y="212" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="end">under-voltage trip</text><text x="88" y="130" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="start">healthy window</text><text x="570" y="130" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#15803d" text-anchor="end" xml:lang="ar">النطاق السليم</text><path d="M84 160 C148 140 178 176 238 158 C288 144 318 214 378 210 C428 206 458 150 570 152" fill="none" stroke="#c2410c" stroke-width="2.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="378" cy="210" r="4.5" fill="#b91c1c"/><text x="378" y="232" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="600" fill="#b91c1c" text-anchor="middle">trip + delay</text><text x="16" y="292" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">A delay stops a momentary dip tripping the plant; too long a delay defeats the relay.</text><text x="624" y="308" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">التأخير يمنع الفصل العابر ولا يُطال أكثر من اللازم</text></svg>