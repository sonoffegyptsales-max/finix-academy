<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-label="Terminal-by-terminal retrofit of a conventional switch to a smart switch"><rect width="700" height="372" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Retrofit wiring: what goes where</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">توصيل الاستبدال: ما يذهب أين</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><text x="40" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#5b6472" font-weight="700" text-anchor="start">EXISTING</text><text x="400" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#c2410c" font-weight="700" text-anchor="start">SMART SWITCH</text><circle cx="70" cy="104" r="13" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/><text x="70" y="108.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700" text-anchor="middle">L</text><text x="96" y="108.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">live in</text><circle cx="430" cy="104" r="13" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/><text x="430" y="108.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#b91c1c" font-weight="700" text-anchor="middle">L</text><line x1="83" y1="104" x2="417" y2="104" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><circle cx="70" cy="148" r="13" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="70" y="152.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">N</text><text x="96" y="152.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">neutral</text><circle cx="430" cy="148" r="13" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="430" y="152.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">N</text><line x1="83" y1="148" x2="417" y2="148" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><circle cx="70" cy="192" r="13" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="70" y="196.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#c2410c" font-weight="700" text-anchor="middle">L1</text><text x="96" y="196.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">switched live out</text><circle cx="430" cy="192" r="13" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="430" y="196.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#c2410c" font-weight="700" text-anchor="middle">L1</text><line x1="83" y1="192" x2="417" y2="192" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><circle cx="70" cy="236" r="13" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/><text x="70" y="240.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#15803d" font-weight="700" text-anchor="middle">E</text><text x="96" y="240.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">earth</text><circle cx="430" cy="236" r="13" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/><text x="430" y="240.5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#15803d" font-weight="700" text-anchor="middle">E</text><line x1="83" y1="236" x2="417" y2="236" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><rect x="470" y="86" width="190" height="168" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="565" y="112" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#c2410c" font-weight="700" text-anchor="middle">Before you disconnect</text><text x="486" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">1. Photograph the terminals</text><text x="486" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">2. Label every conductor</text><text x="486" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">3. Never trust wire colour</text><text x="486" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">4. Confirm dead, then work</text><text x="40" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">The switched live is the one that goes dead when the old switch is off.</text><text x="684" y="312" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">الخط المُفتاح هو الذي ينقطع عند إطفاء المفتاح القديم</text><text x="16" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">Photograph first: the old wiring is the only record of itself.</text><text x="684" y="362" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">صوّر أولًا — التمديد القديم هو السجل الوحيد لنفسه</text></svg>