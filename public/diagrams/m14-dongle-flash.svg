<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="Ordered procedure for flashing a Zigbee coordinator dongle"><rect width="700" height="300" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Flashing a Zigbee coordinator: the order that matters</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">ترتيب خطوات برمجة الدونجل</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><circle cx="54" cy="92" r="19" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/><text x="54" y="97" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#c2410c" font-weight="700" text-anchor="middle">1</text><text x="54" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Back up</text><text x="54" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">current firmware</text><line x1="78" y1="92" x2="112" y2="92" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M112 92 L105 88 L105 96 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><circle cx="164" cy="92" r="19" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/><text x="164" y="97" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#c2410c" font-weight="700" text-anchor="middle">2</text><text x="164" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Bootloader</text><text x="164" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">hold BOOT, then plug</text><line x1="188" y1="92" x2="222" y2="92" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M222 92 L215 88 L215 96 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><circle cx="274" cy="92" r="19" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/><text x="274" y="97" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#c2410c" font-weight="700" text-anchor="middle">3</text><text x="274" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Erase</text><text x="274" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">full chip</text><line x1="298" y1="92" x2="332" y2="92" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M332 92 L325 88 L325 96 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><circle cx="384" cy="92" r="19" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/><text x="384" y="97" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#c2410c" font-weight="700" text-anchor="middle">4</text><text x="384" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Write</text><text x="384" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">coordinator image</text><line x1="408" y1="92" x2="442" y2="92" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M442 92 L435 88 L435 96 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><circle cx="494" cy="92" r="19" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/><text x="494" y="97" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#c2410c" font-weight="700" text-anchor="middle">5</text><text x="494" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Verify</text><text x="494" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">read back</text><line x1="518" y1="92" x2="552" y2="92" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M552 92 L545 88 L545 96 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><circle cx="604" cy="92" r="19" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/><text x="604" y="97" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">6</text><text x="604" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Re-pair</text><text x="604" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">devices rejoin</text><rect x="22" y="178" width="656" height="56" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="38" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#b91c1c" font-weight="700" text-anchor="start">Step 6 is not optional.</text><text x="38" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">A new coordinator has a new network key — every device must be re-paired, and the client must be told before you start.</text><text x="16" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">Skipping the backup means a failed write leaves you with no route home.</text><text x="684" y="290" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">تجاهل النسخة الاحتياطية يعني فقدان طريق العودة</text></svg>