<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-label="Alpha Control expansion modules"><rect width="660" height="340" fill="#ffffff"/><text x="16" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="14.5" font-weight="700" fill="#12151b" text-anchor="start">Alpha Control expansion modules</text><text x="644" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="end" xml:lang="ar">وحدات التوسعة</text><line x1="16" y1="34" x2="644" y2="34" stroke="#d7dee8" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><rect x="28" y="76" width="168" height="188" rx="7" fill="#fff7f3" stroke="#c2410c" stroke-width="1.9"/><text x="112" y="106" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">ALPHA CORE</text><text x="154" y="128" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">الوحدة الأساسية</text><text x="112" y="156" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="600" fill="#12151b" text-anchor="middle">16 AC inputs</text><text x="112" y="174" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="600" fill="#12151b" text-anchor="middle">16 relay outputs</text><text x="112" y="192" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="middle">10A @ 250V each</text><text x="112" y="216" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="700" fill="#c2410c" text-anchor="middle">3 expansion slots</text><text x="112" y="234" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="middle">auto-detected</text><rect x="268" y="76" width="214" height="52" rx="6" fill="#f1f4f8" stroke="#12151b" stroke-width="1.5"/><text x="280" y="97" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#12151b" text-anchor="start">High-Current</text><text x="280" y="115" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="start">4 ch x 50A (200A)</text><text x="636" y="97" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">تيار عالي</text><text x="492" y="115" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="start">motors, EV, pumps</text><line x1="196" y1="170" x2="268" y2="102" stroke="#c2410c" stroke-width="1.4" opacity="1.0" stroke-linecap="round"/><circle cx="268" cy="102" r="3" fill="#c2410c"/><rect x="268" y="140" width="214" height="52" rx="6" fill="#f1f4f8" stroke="#12151b" stroke-width="1.5"/><text x="280" y="161" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#12151b" text-anchor="start">Sound System</text><text x="280" y="179" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="start">8 audio zones</text><text x="636" y="161" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">نظام الصوت</text><text x="492" y="179" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="start">paging, multi-room</text><line x1="196" y1="170" x2="268" y2="166" stroke="#c2410c" stroke-width="1.4" opacity="1.0" stroke-linecap="round"/><circle cx="268" cy="166" r="3" fill="#c2410c"/><rect x="268" y="204" width="214" height="52" rx="6" fill="#f1f4f8" stroke="#12151b" stroke-width="1.5"/><text x="280" y="225" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#12151b" text-anchor="start">Interlock</text><text x="280" y="243" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="start">4 ch, hardware fail-safe</text><text x="636" y="225" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">القفل التبادلي</text><text x="492" y="243" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="start">reversing, doors</text><line x1="196" y1="170" x2="268" y2="230" stroke="#c2410c" stroke-width="1.4" opacity="1.0" stroke-linecap="round"/><circle cx="268" cy="230" r="3" fill="#c2410c"/><text x="16" y="314" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">Up to 3 child boards on one core -- no extra wiring, one firmware.</text><text x="644" y="330" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">لحد 3 وحدات على كور واحد — من غير أسلاك زيادة، وفيرموير واحد</text></svg>