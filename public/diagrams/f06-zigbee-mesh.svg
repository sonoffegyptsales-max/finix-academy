<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" width="640" height="364" role="img" aria-label="Zigbee mesh routing and self healing"><rect width="640" height="364" fill="#ffffff"/><text x="16" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="14.5" font-weight="700" fill="#12151b" text-anchor="start">How a Zigbee mesh routes and heals</text><text x="624" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="end" xml:lang="ar">كيف توجّه شبكة زيجبي وتلتئم</text><line x1="16" y1="34" x2="624" y2="34" stroke="#d7dee8" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><rect x="72" y="174" width="68" height="44" rx="6" fill="#fff7f3" stroke="#c2410c" stroke-width="1.9"/><text x="106" y="201" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">GW</text><text x="106" y="234" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="middle">coordinator</text><circle cx="268" cy="118" r="20" fill="#f1f4f8" stroke="#12151b" stroke-width="1.7"/><text x="268" y="123" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#12151b" text-anchor="middle">R1</text><circle cx="268" cy="264" r="20" fill="#f1f4f8" stroke="#12151b" stroke-width="1.7"/><text x="268" y="269" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#12151b" text-anchor="middle">R2</text><circle cx="424" cy="190" r="20" fill="#f1f4f8" stroke="#12151b" stroke-width="1.7"/><text x="424" y="195" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#12151b" text-anchor="middle">R3</text><text x="268" y="88" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="middle">mains-powered routers relay</text><circle cx="544" cy="122" r="16" fill="#ffffff" stroke="#5b6472" stroke-width="1.5"/><text x="544" y="126.5" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="700" fill="#5b6472" text-anchor="middle">E1</text><circle cx="544" cy="258" r="16" fill="#ffffff" stroke="#5b6472" stroke-width="1.5"/><text x="544" y="262.5" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="700" fill="#5b6472" text-anchor="middle">E2</text><text x="544" y="296" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="middle">battery end devices</text><text x="544" y="312" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10" font-weight="500" fill="#5b6472" text-anchor="middle" xml:lang="ar">أجهزة طرفية لا ترحّل</text><line x1="140" y1="188" x2="248" y2="128" stroke="#12151b" stroke-width="1.5" opacity="0.75" stroke-linecap="round"/><line x1="140" y1="204" x2="248" y2="256" stroke="#12151b" stroke-width="1.5" opacity="0.75" stroke-linecap="round"/><line x1="288" y1="128" x2="408" y2="180" stroke="#12151b" stroke-width="1.5" opacity="0.75" stroke-linecap="round"/><line x1="288" y1="254" x2="408" y2="200" stroke="#12151b" stroke-width="1.5" opacity="0.75" stroke-linecap="round"/><line x1="444" y1="182" x2="528" y2="128" stroke="#12151b" stroke-width="1.5" opacity="0.75" stroke-linecap="round"/><line x1="444" y1="198" x2="528" y2="252" stroke="#12151b" stroke-width="1.5" opacity="0.75" stroke-linecap="round"/><line x1="288" y1="138" x2="288" y2="244" stroke="#b91c1c" stroke-width="2.0" opacity="1.0" stroke-linecap="round" stroke-dasharray="5 4"/><text x="296" y="196" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="600" fill="#b91c1c" text-anchor="start">failed link</text><path d="M288 138 C340 150 340 232 288 244" fill="none" stroke="#15803d" stroke-width="2.0" opacity="1.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="352" y="226" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="start">traffic re-routes via R3</text><text x="16" y="338" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">Only mains-powered devices relay. Adding battery sensors never strengthens a mesh.</text><text x="624" y="354" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">الأجهزة المغذاة وحدها ترحّل</text></svg>