<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-label="Decision table comparing Wi-Fi, Zigbee and Matter"><rect width="700" height="372" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Wi-Fi, Zigbee or Matter: what decides</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">ما الذي يحدد اختيار البروتوكول</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="30" y="62" width="250" height="30" rx="4" fill="#f1f5f9" stroke="#c9d2de" stroke-width="1.2"/><text x="40" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Question</text><rect x="280" y="62" width="130" height="30" rx="4" fill="#f1f5f9" stroke="#c9d2de" stroke-width="1.2"/><text x="290" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Wi-Fi</text><rect x="410" y="62" width="140" height="30" rx="4" fill="#f1f5f9" stroke="#c9d2de" stroke-width="1.2"/><text x="420" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Zigbee 3.0</text><rect x="550" y="62" width="140" height="30" rx="4" fill="#f1f5f9" stroke="#c9d2de" stroke-width="1.2"/><text x="560" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Matter</text><rect x="30" y="92" width="250" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="40" y="117.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">Device count in the home</text><rect x="280" y="92" width="130" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="290" y="117.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">under ~15</text><rect x="410" y="92" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="420" y="117.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">15 and above</text><rect x="550" y="92" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="560" y="117.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">any</text><rect x="30" y="134" width="250" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="40" y="159.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">Needs a hub</text><rect x="280" y="134" width="130" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="290" y="159.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">no</text><rect x="410" y="134" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="420" y="159.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">yes — gateway</text><rect x="550" y="134" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="560" y="159.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">yes — border router</text><rect x="30" y="176" width="250" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="40" y="201.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">Battery sensors</text><rect x="280" y="176" width="130" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="290" y="201.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">poor</text><rect x="410" y="176" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="420" y="201.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">excellent</text><rect x="550" y="176" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="560" y="201.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">excellent</text><rect x="30" y="218" width="250" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="40" y="243.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">Works if internet drops</text><rect x="280" y="218" width="130" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="290" y="243.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">often not</text><rect x="410" y="218" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="420" y="243.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">yes, locally</text><rect x="550" y="218" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="560" y="243.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">yes, locally</text><rect x="30" y="260" width="250" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="40" y="285.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">Cross-brand control</text><rect x="280" y="260" width="130" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="290" y="285.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">app-bound</text><rect x="410" y="260" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="420" y="285.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">brand mesh</text><rect x="550" y="260" width="140" height="42" rx="0" fill="none" stroke="#c9d2de" stroke-width="1.0"/><text x="560" y="285.0" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">by design</text><text x="16" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">Count the battery sensors first — that one answer usually settles the protocol.</text><text x="684" y="362" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">عدد حساسات البطارية يحسم الاختيار غالبًا</text></svg>