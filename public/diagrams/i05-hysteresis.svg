<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" role="img" aria-label="Hysteresis differential band"><rect width="640" height="318" fill="#ffffff"/><text x="16" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="14.5" font-weight="700" fill="#12151b" text-anchor="start">Hysteresis prevents chatter</text><text x="624" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="end" xml:lang="ar">الفجوة الفارقة تمنع الاهتزاز</text><line x1="16" y1="34" x2="624" y2="34" stroke="#d7dee8" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><line x1="70" y1="236" x2="70" y2="77" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M70 72 L66 79 L74 79 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="70" y1="236" x2="581" y2="236" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M586 236 L579 232 L579 240 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="62" y="82" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#5b6472" text-anchor="end">level</text><text x="586" y="256" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="end">time</text><line x1="70" y1="132" x2="576" y2="132" stroke="#b91c1c" stroke-width="1.3" opacity="1.0" stroke-linecap="round" stroke-dasharray="5 4"/><text x="580" y="125" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="end">cut-out</text><line x1="70" y1="178" x2="576" y2="178" stroke="#15803d" stroke-width="1.3" opacity="1.0" stroke-linecap="round" stroke-dasharray="5 4"/><text x="580" y="194" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="end">cut-in</text><path d="M80 200 C140 200 160 120 240 124 C320 128 340 206 420 200 C480 196 500 130 566 134" fill="none" stroke="#c2410c" stroke-width="2.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 132 L70 178" fill="none" stroke="#5b6472" stroke-width="0" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><line x1="150" y1="132" x2="150" y2="178" stroke="#5b6472" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><line x1="150" y1="132" x2="150" y2="173" stroke="#5b6472" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><path d="M150 178 L146 171 L154 171 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.2" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="158" y="159.0" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="600" fill="#5b6472" text-anchor="start">differential</text><text x="620" y="175.0" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">الفجوة</text><text x="16" y="292" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">A single threshold would switch repeatedly as the level hovers. The gap forces travel.</text><text x="624" y="308" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">العتبة الواحدة تجعل التلامس يهتز عند الحد</text></svg>