ystem-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#12151b" text-anchor="start">W1</text><circle cx="165" cy="185" r="4.5" fill="#c2410c"/><text x="151" y="207" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="10.5" font-weight="600" fill="#c2410c" text-anchor="end">neutral point</text><text x="165" y="281" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="middle">phase voltage = line / 1.73</text><text x="470" y="74" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13.5" font-weight="700" fill="#12151b" text-anchor="middle">Delta (D)</text><text x="528" y="74" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="middle" fill="#5b6472" text-anchor="end" xml:lang="ar">دلتا</text><line x1="470" y1="130.88" x2="403.88" y2="216.0" stroke="#12151b" stroke-width="2.0" opacity="1.0" stroke-linecap="round"/><line x1="403.88" y1="216.0" x2="536.12" y2="216.0" stroke="#12151b" stroke-width="2.0" opacity="1.0" stroke-linecap="round"/><line x1="536.12" y1="216.0" x2="470" y2="130.88" stroke="#12151b" stroke-width="2.0" opacity="1.0" stroke-linecap="round"/><circle cx="470" cy="130.88" r="3.0" fill="#12151b"/><text x="470" y="118.88" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="700" fill="#12151b" text-anchor="middle">U1/W2</text><circle cx="403.88" cy="216.0" r="3.0" fill="#12151b"/><text x="403.88" y="236.0" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="700" fill="#12151b" text-anchor="end">V1/U2</text><circle cx="536.12" cy="216.0" r="3.0" fill="#12151b"/><text x="536.12" y="236.0" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="700" fill="#12151b" text-anchor="start">W1/V2</text><text x="470" y="274" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="middle">phase voltage = line voltage</text><line x1="320" y1="96" x2="320" y2="268" stroke="#d7dee8" stroke-width="1.2" opacity="1.0" stroke-linecap="round" stroke-dasharray="4 5"/><text x="16" y="322" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">Same motor, same supply: star gives about a third of the delta torque and current.</text><text x="624" y="338" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">النجمة تعطي نحو ثلث عزم وتيار الدلتا</text></svg>