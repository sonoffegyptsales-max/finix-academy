<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-label="Three integration routes from SONOFF devices to Home Assistant"><rect width="700" height="330" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Three ways SONOFF reaches Home Assistant</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">ثلاث طرق للربط مع Home Assistant</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="30" y="42" width="200" height="52" rx="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5"/><text x="42" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">Cloud API</text><text x="42" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">eWeLink account</text><line x1="236" y1="66" x2="330" y2="66" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M330 66 L323 62 L323 70 Z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="340" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="start">internet required</text><text x="340" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">slowest, survives nothing</text><rect x="30" y="120" width="200" height="52" rx="6" fill="#f8fafc" stroke="#15803d" stroke-width="1.5"/><text x="42" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">LAN mode</text><text x="42" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">device on local network</text><line x1="236" y1="144" x2="330" y2="144" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M330 144 L323 140 L323 148 Z" fill="#15803d" stroke="#15803d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="340" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#15803d" font-weight="600" text-anchor="start">no internet needed</text><text x="340" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">fast, limited models</text><rect x="30" y="198" width="200" height="52" rx="6" fill="#f8fafc" stroke="#c2410c" stroke-width="1.5"/><text x="42" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">Zigbee direct</text><text x="42" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">via coordinator dongle</text><line x1="236" y1="222" x2="330" y2="222" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M330 222 L323 218 L323 226 Z" fill="#c2410c" stroke="#c2410c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="340" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="start">no eWeLink at all</text><text x="340" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">fastest, full control</text><text x="30" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#c2410c" font-weight="600" text-anchor="start">Flashing a dongle removes the vendor cloud from the path entirely.</text><text x="684" y="294" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">استخدام الدونجل يلغي الاعتماد على السحابة تمامًا</text></svg>