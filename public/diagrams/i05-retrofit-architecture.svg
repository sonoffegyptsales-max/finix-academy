ight="500" fill="#5b6472" text-anchor="start">Push buttons</text><line x1="482" y1="137" x2="507" y2="137" stroke="#c2410c" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><path d="M512 137 L505 133 L505 141 Z" fill="#c2410c" stroke="#c2410c" stroke-width="1.2" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="520" y="141" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="start">app / scene</text><text x="384" y="177" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">Mechanical timer</text><line x1="482" y1="173" x2="507" y2="173" stroke="#c2410c" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><path d="M512 173 L505 169 L505 177 Z" fill="#c2410c" stroke="#c2410c" stroke-width="1.2" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="520" y="177" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="start">schedule</text><text x="384" y="213" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">Sensor switch</text><line x1="482" y1="209" x2="507" y2="209" stroke="#c2410c" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><path d="M512 209 L505 205 L505 213 Z" fill="#c2410c" stroke="#c2410c" stroke-width="1.2" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><text x="520" y="213" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="start">sensor input</text><text x="384" y="249" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">Inter-panel wiring</text><line x1="482" 