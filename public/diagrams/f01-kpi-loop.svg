<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 366" width="660" height="366" role="img" aria-label="Continuous performance evaluation loop"><rect width="660" height="366" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Performance evaluation as a loop</text><text x="644" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">تقييم الأداء كدورة مستمرة</text><line x1="16" y1="34" x2="644" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><circle cx="330" cy="172" r="78" fill="none" stroke="#c9d2de" stroke-width="1.4"/><circle cx="330" cy="94" r="30" fill="#fff7ed" stroke="#c2410c" stroke-width="1.7"/><text x="330" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Observe</text><text x="330" y="50" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">on real jobs</text><circle cx="408" cy="172" r="30" fill="#fff7ed" stroke="#c2410c" stroke-width="1.7"/><text x="408" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Measure</text><text x="446" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="start">against the KPI</text><circle cx="330" cy="250" r="30" fill="#fff7ed" stroke="#c2410c" stroke-width="1.7"/><text x="330" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Feed back</text><text x="330" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">same week</text><circle cx="252" cy="172" r="30" fill="#fff7ed" stroke="#c2410c" stroke-width="1.7"/><text x="252" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">Train</text><text x="214" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="end">on the gap</text><text x="40" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#c2410c" font-weight="600" text-anchor="start">A KPI measured once a year is a record, not a tool.</text><text x="644" y="324" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">المؤشر الذي يُقاس مرة سنويًا سجل لا أداة</text></svg>