<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" role="img" aria-label="Systematic fault finding method"><rect width="640" height="348" fill="#ffffff"/><text x="16" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="14.5" font-weight="700" fill="#12151b" text-anchor="start">Systematic fault-finding</text><text x="624" y="24" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="end" xml:lang="ar">التشخيص المنهجي للأعطال</text><line x1="16" y1="34" x2="624" y2="34" stroke="#d7dee8" stroke-width="1.2" opacity="1.0" stroke-linecap="round"/><circle cx="44" cy="88" r="15" fill="#fff7f3" stroke="#c2410c" stroke-width="1.7"/><text x="44" y="93" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">1</text><text x="74" y="85" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12.5" font-weight="700" fill="#12151b" text-anchor="start">Confirm the symptom</text><text x="74" y="102" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">reproduce it before touching anything</text><text x="624" y="85" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">شاهد العطل بنفسك</text><line x1="44" y1="106" x2="44" y2="113" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M44 118 L40 111 L48 111 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="44" cy="138" r="15" fill="#fff7f3" stroke="#c2410c" stroke-width="1.7"/><text x="44" y="143" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">2</text><text x="74" y="135" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12.5" font-weight="700" fill="#12151b" text-anchor="start">Is there supply?</text><text x="74" y="152" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">measure at the incomer, not the label</text><text x="624" y="135" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">هل يوجد جهد؟</text><line x1="44" y1="156" x2="44" y2="163" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M44 168 L40 161 L48 161 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="44" cy="188" r="15" fill="#fff7f3" stroke="#c2410c" stroke-width="1.7"/><text x="44" y="193" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">3</text><text x="74" y="185" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12.5" font-weight="700" fill="#12151b" text-anchor="start">Control or power?</text><text x="74" y="202" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">split the circuit in half</text><text x="624" y="185" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">تحكم أم قدرة؟</text><line x1="44" y1="206" x2="44" y2="213" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M44 218 L40 211 L48 211 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="44" cy="238" r="15" fill="#fff7f3" stroke="#c2410c" stroke-width="1.7"/><text x="44" y="243" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">4</text><text x="74" y="235" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12.5" font-weight="700" fill="#12151b" text-anchor="start">Which half fails?</text><text x="74" y="252" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">halve again, do not guess</text><text x="624" y="235" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">أي نصف يفشل؟</text><line x1="44" y1="256" x2="44" y2="263" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linecap="round"/><path d="M44 268 L40 261 L48 261 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.3" opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="44" cy="288" r="15" fill="#fff7f3" stroke="#c2410c" stroke-width="1.7"/><text x="44" y="293" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">5</text><text x="74" y="285" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="12.5" font-weight="700" fill="#12151b" text-anchor="start">Prove the repair</text><text x="74" y="302" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="start">restore and re-test under load</text><text x="624" y="285" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">أثبت الإصلاح</text><text x="16" y="322" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11.5" font-weight="500" fill="#5b6472" text-anchor="start" font-style="italic">Halving beats guessing: each measurement must eliminate half of what remains.</text><text x="624" y="338" font-family="system-ui,-apple-system,Segoe UI,Noto Sans Arabic,sans-serif" font-size="11" font-weight="500" fill="#5b6472" text-anchor="end" xml:lang="ar">كل قياس يستبعد نصف الاحتمالات</text></svg>