<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-label="Mapping Zigbee mesh symptoms to their root causes"><rect width="700" height="372" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Zigbee symptom to root cause</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">من العَرَض إلى السبب الجذري</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="30" y="66" width="250" height="58" rx="6" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/><text x="44" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">One device drops,</text><text x="44" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">always the same one</text><line x1="288" y1="95" x2="348" y2="95" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M348 95 L341 91 L341 99 Z" fill="#c2410c" stroke="#c2410c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="358" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="start">out of range, or</text><text x="358" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">no router nearby</text><rect x="30" y="134" width="250" height="58" rx="6" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/><text x="44" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">Several drop</text><text x="44" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">at the same time</text><line x1="288" y1="163" x2="348" y2="163" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M348 163 L341 159 L341 167 Z" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="358" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="start">a router died, or</text><text x="358" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">lost its power</text><rect x="30" y="202" width="250" height="58" rx="6" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/><text x="44" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">Everything is slow</text><text x="44" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">after adding devices</text><line x1="288" y1="231" x2="348" y2="231" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M348 231 L341 227 L341 235 Z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="358" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="start">too few routers</text><text x="358" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">for the device count</text><rect x="30" y="270" width="250" height="58" rx="6" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.2"/><text x="44" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">Drops at one time</text><text x="44" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="start">of day only</text><line x1="288" y1="299" x2="348" y2="299" stroke="#15803d" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M348 299 L341 295 L341 303 Z" fill="#15803d" stroke="#15803d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="358" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#15803d" font-weight="600" text-anchor="start">interference — check</text><text x="358" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">Wi-Fi channel overlap</text><text x="30" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="start">Mains-powered devices route. Battery devices never do — counting them as coverage is the usual mistake.</text></svg>