<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 348" width="700" height="348" role="img" aria-label="Dimmer modes matched to load types and their failure symptoms"><rect width="700" height="348" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Dimmer load types and what goes wrong</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">أنواع الأحمال مع الديمر وما يحدث من أخطاء</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="30" y="66" width="640" height="46" rx="5" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.1"/><text x="44" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Leading edge</text><text x="44" y="102" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">wire-wound transformer, incandescent</text><circle cx="360" cy="89" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/><text x="376" y="93" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="start">hum, flicker on LED</text><rect x="30" y="118" width="640" height="46" rx="5" fill="#ffffff" stroke="#c9d2de" stroke-width="1.1"/><text x="44" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Trailing edge</text><text x="44" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">LED driver, electronic transformer</text><circle cx="360" cy="141" r="5" fill="#15803d" stroke="#15803d" stroke-width="0"/><text x="376" y="145" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#15803d" font-weight="600" text-anchor="start">correct for most LED</text><rect x="30" y="170" width="640" height="46" rx="5" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.1"/><text x="44" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Wrong mode</text><text x="44" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">LED on leading edge</text><circle cx="360" cy="193" r="5" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/><text x="376" y="197" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="start">buzz, early driver failure</text><rect x="30" y="222" width="640" height="46" rx="5" fill="#ffffff" stroke="#c9d2de" stroke-width="1.1"/><text x="44" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Below minimum</text><text x="44" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="start">load under the dimmer's floor</text><circle cx="360" cy="245" r="5" fill="#c2410c" stroke="#c2410c" stroke-width="0"/><text x="376" y="249" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="start">flicker, will not strike</text><text x="30" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="start">Set the mode to match the driver, then raise the minimum until it strikes cleanly every time.</text><text x="16" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">A dimmer that works at 80% and flickers at 10% is set wrong, not faulty.</text><text x="684" y="338" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">الوميض عند الخفض يعني ضبطًا خاطئًا لا عطلًا</text></svg>