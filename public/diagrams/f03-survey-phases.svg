<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 318" width="700" height="318" role="img" aria-label="Five ordered phases of a site survey"><rect width="700" height="318" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Site survey: five phases, in order</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">المسح الميداني: خمس مراحل مرتبة</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="34" y="72" width="118" height="60" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="93" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">1. Walk</text><text x="93" y="117" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">see the property</text><line x1="156" y1="102" x2="162" y2="102" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M162 102 L155 98 L155 106 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><rect x="166" y="72" width="118" height="60" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="225" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">2. Ask</text><text x="225" y="117" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">what bothers them</text><line x1="288" y1="102" x2="294" y2="102" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M294 102 L287 98 L287 106 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><rect x="298" y="72" width="118" height="60" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="357" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">3. Measure</text><text x="357" y="117" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">wiring, signal, loads</text><line x1="420" y1="102" x2="426" y2="102" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M426 102 L419 98 L419 106 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><rect x="430" y="72" width="118" height="60" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="489" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">4. Record</text><text x="489" y="117" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">photos and forms</text><line x1="552" y1="102" x2="558" y2="102" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M558 102 L551 98 L551 106 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><rect x="562" y="72" width="118" height="60" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/><text x="621" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">5. Propose</text><text x="621" y="117" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5b6472" font-weight="500" text-anchor="middle">scope and price</text><text x="34" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="700" text-anchor="start">Proposing before measuring is how a job loses money.</text><text x="684" y="200" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">التسعير قبل القياس هو سبب خسارة العمل</text><text x="34" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start">The client's answer in phase 2 decides which measurements matter in phase 3.</text><text x="16" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">A survey that skips photos always costs a second visit.</text><text x="684" y="308" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">المسح بلا صور يكلف زيارة ثانية</text></svg>