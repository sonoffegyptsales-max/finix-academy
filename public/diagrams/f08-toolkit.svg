<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 348" width="700" height="348" role="img" aria-label="Field toolkit grouped by the failure each tool prevents"><rect width="700" height="348" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">The field toolkit, grouped by what it prevents</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">حقيبة الأدوات مرتبة حسب ما تمنعه</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="30" y="62" width="210" height="178" rx="8" fill="#f8fafc" stroke="#15803d" stroke-width="1.6"/><text x="135" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#15803d" font-weight="700" text-anchor="middle">Prevents injury</text><line x1="46" y1="100" x2="224" y2="100" stroke="#c9d2de" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><text x="135" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">Voltage tester (البنسة الاختبار)</text><text x="135" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">Insulated screwdrivers</text><text x="135" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">Lock-off kit</text><rect x="253" y="62" width="210" height="178" rx="8" fill="#f8fafc" stroke="#c2410c" stroke-width="1.6"/><text x="358" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#c2410c" font-weight="700" text-anchor="middle">Prevents damage</text><line x1="269" y1="100" x2="447" y2="100" stroke="#c9d2de" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><text x="358" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">Side cutters (القصافة)</text><text x="358" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">Wire strippers</text><text x="358" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">Torque screwdriver</text><rect x="476" y="62" width="210" height="178" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.6"/><text x="581" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">Prevents callbacks</text><line x1="492" y1="100" x2="670" y2="100" stroke="#c9d2de" stroke-width="1.1" stroke-linecap="round" opacity="1.0"/><text x="581" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">Clamp meter (البنسة الأمبير)</text><text x="581" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">Network tester</text><text x="581" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">Label printer</text><text x="30" y="276" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#c2410c" font-weight="600" text-anchor="start">Buy in that order. The cheapest tool that prevents one injury has already paid for itself.</text><text x="16" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="start" font-style="italic">A clamp meter turns a guess about load into a number.</text><text x="684" y="338" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="end">بنسة الأمبير تحوّل التخمين إلى رقم</text></svg>