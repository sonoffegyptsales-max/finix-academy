<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 348" width="700" height="348" role="img" aria-label="Three-network segmentation with one-way access from main to IoT"><rect width="700" height="348" fill="#ffffff"/><text x="16" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">Network segmentation for smart home devices</text><text x="684" y="24" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="13.5" fill="#5b6472" font-weight="600" text-anchor="end">تقسيم الشبكة لأجهزة المنزل الذكي</text><line x1="16" y1="34" x2="684" y2="34" stroke="#d7dee8" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><rect x="40" y="66" width="190" height="76" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.7"/><text x="135" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">MAIN</text><text x="135" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">phones, laptops, work</text><rect x="255" y="66" width="190" height="76" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.7"/><text x="350" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#c2410c" font-weight="700" text-anchor="middle">IOT</text><text x="350" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">smart devices only</text><rect x="470" y="66" width="190" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.7"/><text x="565" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">GUEST</text><text x="565" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#5b6472" font-weight="500" text-anchor="middle">visitors, isolated</text><line x1="230" y1="104" x2="250" y2="104" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" opacity="1.0"/><path d="M250 104 L243 100 L243 108 Z" fill="#5b6472" stroke="#5b6472" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><text x="240" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#5b6472" font-weight="500" text-anchor="middle">one way</text><path d="M450 104 L470 104" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/><line x1="455" y1="96" x2="465" y2="112" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" opacity="1.0"/><line x1="465" y1="96" x2="455" y2="112" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" opacity="1.0"/><text x="40" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="start">Main can reach IoT. IoT cannot reach Main. Guest reaches neither.</text><text x="684" y="210" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="11.5" fill="#5b6472" font-weight="500" text-anchor="end">الرئيسية تصل للأجهزة، والأجهزة لا تصل للرئيسية</text><rect x="30" y="228" width="640" height="72" rx="6" fill="none" stroke="#c9d2de" stroke-width="1.2" stroke-dasharray="4 4"/><text x="44" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#c2410c" font-weight="700" text-anchor="start">Why it matters:</text><text x="44" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6472" font-weight="500" text-anchor="start">A compromised camera on a flat network reaches the client's laptop, bank session and files.</text><text x="44" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d" font-weight="600" text-anchor="start">On a segmented network it reaches nothing.</text></svg>